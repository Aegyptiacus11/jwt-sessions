[project]
name = "jwt-sessions"
version = "0.1.0"
description = "First-party JWT auth for FastAPI with rotating, reuse-detecting refresh tokens."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jwt", "auth", "session", "refresh-token", "fastapi"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
]
dependencies = [
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
]

[project.urls]
Repository = "https://github.com/Aegyptiacus11/jwt-sessions"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jwt_sessions"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency idiom.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
