# Publishes jwt-sessions to PyPI, then makes the GitHub Release, when a tag v<version> is
# pushed (the version in pyproject.toml). Nothing is published unless the tag and the commit pass check-tag.sh and
# every job of ci.yml passes on that commit; what is published is the package ci.yml built and
# tried. No token is kept: PyPI gives this workflow a short-lived one (Trusted Publishing, set
# on PyPI for this repository and this file name).
# Run by hand (Actions -> release -> Run workflow), it runs the tests and publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A second run waits: a publish is never stopped halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main too: the tagged commit must be on it
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: The tag is the version, on main
        run: .github/scripts/check-tag.sh "$GITHUB_REF_NAME"

  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag, tests] # skipped when either failed or was skipped
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # the proof PyPI checks before it gives the token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # After the registry: a release names a version that can be installed.
  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: .github/scripts/github-release.sh jwt-sessions "$GITHUB_REF_NAME" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
